<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anh Biết Mà 😘</title>
    <link rel="stylesheet" href="yes_style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="header-text">
        Anh biết mà, cục cưng yêu anh nhất trên đời! ❤️
      </h1>
      <p class="love-message">
        Cảm ơn em vì đã làm trái tim anh rung động mỗi ngày. Yêu em mãi mãi! 😘
      </p>
      <div class="photo-carousel">
        <div class="carousel-inner">
          <div class="photo-frame active">
            <img
              src="img/hình 1.jpg"
              alt="Cặp đôi lãng mạn 1"
              class="couple-photo"
            />
          </div>
          <div class="photo-frame">
            <img
              src="img/hình 2.jpg"
              alt="Cặp đôi lãng mạn 2"
              class="couple-photo"
            />
          </div>
          <div class="photo-frame">
            <img
              src="img/hình 3.jpg"
              alt="Cặp đôi lãng mạn 3"
              class="couple-photo"
            />
          </div>
        </div>
      </div>
      <button class="back-button">Quay Lại</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="yes_script.js"></script>
  </body>
</html>
