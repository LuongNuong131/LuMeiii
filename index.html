<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cục dàng có yêu anh hong? 💕</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="particles-js"></div>
    <audio id="bg-music" loop>
      <source
        src="https://cdn.pixabay.com/download/audio/2023/03/30/audio_c5b0ff32cf.mp3?filename=romantic-love-143899.mp3"
        type="audio/mp3"
      />
    </audio>
    <button id="music-toggle" class="music-toggle">🔊</button>
    <div class="container">
      <h1 id="typewriter">Cục dàng có yêu anh hong? 💌</h1>
      <div class="buttons">
        <button class="yes-button">Có 😍</button>
        <button class="no-button">Hông 🙈</button>
      </div>
      <div class="gif_container">
        <img
          src="https://media1.giphy.com/media/VM1fcpu2bKs1e2Kdbj/giphy.gif"
          alt="Cute GIF"
        />
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
